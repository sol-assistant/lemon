<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Change any photo by describing it.">
<title>Edit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Cpath d='M18 46l4-12 18-18 8 8-18 18z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000; --card:#121214; --card2:#1c1c1e; --line:rgba(255,255,255,.09);
  --text:#f5f5f7; --dim:#8e8e93; --accent:#fa2d48; --accent2:#ff5e73; --ok:#30d158; --warn:#ffd60a;
  --radius:22px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f5f5f7; --card:#fff; --card2:#f0f0f3; --line:rgba(0,0,0,.08); --text:#1d1d1f; --dim:#6e6e73; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:"Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  font-weight:300; -webkit-font-smoothing:antialiased; line-height:1.4;
  min-height:100vh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main{max-width:620px;margin:0 auto;padding:28px 18px 56px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:8px 4px 22px}
h1{font-weight:200;font-size:44px;letter-spacing:-.02em;margin:0}
h1 span{color:var(--accent)}
.tag{color:var(--dim);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.drop{
  position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
  min-height:260px;border-radius:16px;background:var(--card2);overflow:hidden;cursor:pointer;
  border:1.5px dashed transparent;transition:border-color .2s, background .2s;
}
.drop.over{border-color:var(--accent)}
.drop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.drop .hint{color:var(--dim);font-size:16px;text-align:center;padding:0 20px}
.drop .plus{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:30px;font-weight:200;line-height:1}
.drop img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.drop img[hidden]{display:none}
.drop.has .hint,.drop.has .plus{display:none}
.swap{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;padding:7px 13px;font:inherit;font-size:13px;font-weight:400;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;cursor:pointer}
.drop.has .swap{display:block}
label.lbl{display:block;font-size:13px;color:var(--dim);margin:2px 4px 8px;letter-spacing:.02em;text-transform:uppercase;font-weight:400}
textarea{
  width:100%;resize:none;border:0;outline:0;background:var(--card2);color:var(--text);
  font:inherit;font-size:18px;font-weight:300;border-radius:14px;padding:14px 15px;min-height:76px;
}
textarea:focus{box-shadow:0 0 0 2px var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip:active{background:var(--card2)}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;cursor:pointer;
  background:var(--accent);color:#fff;font:inherit;font-size:18px;font-weight:400;border-radius:16px;padding:16px;
  transition:transform .1s, opacity .2s;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.ghost:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.ghost{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:16px;font-weight:400;border-radius:14px;padding:13px;cursor:pointer}
.row{display:flex;gap:10px;margin-top:12px}
.status{display:none;align-items:center;gap:12px;margin:14px 4px 0;color:var(--dim);font-size:15px}
.status.on{display:flex}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:r 1s linear infinite;flex:0 0 auto}
@keyframes r{to{transform:rotate(360deg)}}
.msg{display:none;margin:14px 2px 0;padding:13px 15px;border-radius:14px;font-size:15px;background:var(--card2)}
.msg.on{display:block}
.msg.err{color:#ff6961}
.msg.limit{color:var(--warn)}
.result{display:none}
.result.on{display:block}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--card2)}
.stage img{display:block;width:100%;height:auto}
.stage .before{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .15s;background:var(--card2)}
.stage.show-before .before{opacity:1}
.pill{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:400;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:none}
.small{color:var(--dim);font-size:13px;margin:10px 4px 0}
details{margin-top:6px}
summary{cursor:pointer;color:var(--dim);font-size:14px;list-style:none;padding:6px 4px}
summary::-webkit-details-marker{display:none}
details input{width:100%;border:0;outline:0;background:var(--card2);color:var(--text);font:inherit;font-size:15px;border-radius:12px;padding:12px 13px;margin-top:6px}
details input:focus{box-shadow:0 0 0 2px var(--accent)}
details p{color:var(--dim);font-size:13px;margin:8px 4px}
details a{color:var(--accent2)}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:26px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Edit<span>.</span></h1>
    <div class="tag">describe it. done.</div>
  </header>

  <section class="card" aria-label="Photo">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo">
      <div class="plus" aria-hidden="true">+</div>
      <div class="hint">Tap to choose a photo<br><small>or drop one here</small></div>
      <img id="preview" alt="Your photo" hidden>
      <button class="swap" id="swap" type="button">Change</button>
    </div>
    <input type="file" id="file" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
  </section>

  <section class="card" aria-label="Instruction">
    <label class="lbl" for="prompt">What should change?</label>
    <textarea id="prompt" rows="2" maxlength="400" placeholder="make the sky purple" enterkeyhint="go"></textarea>
    <div class="chips" id="chips">
      <button class="chip" type="button">make the sky purple</button>
      <button class="chip" type="button">add sunglasses</button>
      <button class="chip" type="button">turn it into an anime drawing</button>
      <button class="chip" type="button">make it nighttime with neon lights</button>
      <button class="chip" type="button">make it look like a 90s film photo</button>
      <button class="chip" type="button">remove the background people</button>
    </div>
  </section>

  <button class="btn" id="go" type="button" disabled>Edit photo</button>
  <div class="status" id="status" role="status" aria-live="polite"><div class="spin"></div><span id="statusText">Working&hellip;</span></div>
  <div class="msg" id="msg" role="alert"></div>

  <section class="card result" id="result" aria-label="Result" style="margin-top:14px">
    <div class="stage" id="stage">
      <img id="out" alt="Edited photo">
      <img id="before" class="before" alt="Original photo">
      <div class="pill" id="pill">After</div>
    </div>
    <div class="small">Hold the image to see the original.</div>
    <div class="row">
      <button class="ghost" id="save" type="button">Save</button>
      <button class="ghost" id="again" type="button">Keep editing</button>
    </div>
  </section>

  <details id="adv">
    <summary>Advanced &rsaquo;</summary>
    <label class="lbl" for="token" style="margin-top:8px">Hugging Face token (optional)</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="hf_...">
    <p>Free AI has a small daily limit per person. A free Hugging Face account token raises it. It&rsquo;s saved only in this browser. <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener">Get a token</a></p>
  </details>

  <footer>Edits take about 20&ndash;60 seconds.</footer>
</main>

<script type="module">
import { Client, handle_file } from "https://cdn.jsdelivr.net/npm/@gradio/client@2.7.2/dist/index.min.js";

// Free instruction-edit models, tried in order.
const MODELS = [
  { space: "black-forest-labs/FLUX.1-Kontext-Dev", endpoint: "/infer",
    args: (img, prompt) => ({ input_image: img, prompt, seed: 0, randomize_seed: true, guidance_scale: 2.5, steps: 28 }) },
  { space: "multimodalart/Qwen-Image-Edit-Fast", endpoint: "/infer",
    args: (img, prompt) => ({ image: img, prompt, seed: 0, randomize_seed: true, true_guidance_scale: 1.0, num_inference_steps: 8, rewrite_prompt: false }) },
  { space: "Qwen/Qwen-Image-Edit", endpoint: "/infer",
    args: (img, prompt) => ({ image: img, prompt, seed: 0, randomize_seed: true, true_guidance_scale: 4.0, num_inference_steps: 30, rewrite_prompt: false }) }
];
const MAX_SIDE = 1024;
const TIMEOUT_MS = 180000;

const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileIn = $("file"), preview = $("preview"), promptEl = $("prompt");
const go = $("go"), statusEl = $("status"), statusText = $("statusText"), msg = $("msg");
const result = $("result"), out = $("out"), beforeImg = $("before"), stage = $("stage"), pill = $("pill");
const tokenEl = $("token");

let inputBlob = null, inputUrl = null, outBlob = null, outUrl = null, busy = false;

tokenEl.value = localStorage.getItem("hf_token") || "";
tokenEl.addEventListener("input", () => {
  const v = tokenEl.value.trim();
  if (v) localStorage.setItem("hf_token", v); else localStorage.removeItem("hf_token");
});

function refresh(){ go.disabled = busy || !inputBlob || !promptEl.value.trim(); }
promptEl.addEventListener("input", refresh);
promptEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); if (!go.disabled) run(); } });
$("chips").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")){ promptEl.value = e.target.textContent; refresh(); promptEl.focus(); }
});

drop.addEventListener("click", (e) => { if (!busy) fileIn.click(); });
drop.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && !busy){ e.preventDefault(); fileIn.click(); } });
fileIn.addEventListener("change", () => { if (fileIn.files[0]) loadFile(fileIn.files[0]); fileIn.value = ""; });
["dragenter","dragover"].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f && !busy) loadFile(f); });
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item && !busy) loadFile(item.getAsFile());
});

async function downscale(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file doesn't look like a photo.")); i.src = url; });
    const s = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(16, Math.round(img.naturalWidth * s)), h = Math.max(16, Math.round(img.naturalHeight * s));
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.92));
  } finally { URL.revokeObjectURL(url); }
}

async function loadFile(file){
  hideMsg();
  try {
    const blob = await downscale(file);
    setInput(blob);
  } catch (err){ showMsg(err.message || "Couldn't open that photo.", "err"); }
}

function setInput(blob){
  inputBlob = blob;
  if (inputUrl) URL.revokeObjectURL(inputUrl);
  inputUrl = URL.createObjectURL(blob);
  preview.src = inputUrl; preview.hidden = false; drop.classList.add("has");
  refresh();
}

function showMsg(text, kind){ msg.textContent = text; msg.className = "msg on " + (kind || ""); }
function hideMsg(){ msg.className = "msg"; }
function setStatus(text){ statusText.textContent = text; }

const isQuota = (t) => /zerogpu|gpu quota|quota|exceeded|runs limit|rate limit|too many requests/i.test(t || "");

function errText(e){
  if (!e) return "Unknown error";
  if (typeof e === "string") return e;
  return e.message || e.error || (e.original_msg) || JSON.stringify(e).slice(0, 300);
}

async function editWith(model, blob, prompt, token, onTick){
  const opts = { events: ["data", "status"] };
  if (token) opts.token = token;
  onTick("Connecting&hellip;");
  const client = await Client.connect(model.space, opts);
  const job = client.submit(model.endpoint, model.args(handle_file(blob), prompt));
  const timer = setTimeout(() => { try { job.cancel(); } catch(_){} }, TIMEOUT_MS);
  try {
    for await (const m of job){
      if (m.type === "status"){
        if (m.stage === "error") throw new Error(m.message || "The AI hit an error.");
        if (m.stage === "pending" && typeof m.position === "number" && m.position > 0) onTick("In line &middot; " + m.position + " ahead");
        else if (m.stage === "pending" || m.stage === "generating") onTick("Editing");
      } else if (m.type === "data"){
        const img = Array.isArray(m.data) ? m.data[0] : m.data;
        const url = img && (img.url || (typeof img === "string" ? img : null));
        if (!url) throw new Error("No image came back.");
        return url;
      }
    }
    throw new Error("The AI stopped without a result.");
  } finally { clearTimeout(timer); }
}

async function run(){
  if (busy || !inputBlob) return;
  const prompt = promptEl.value.trim();
  if (!prompt) return;
  busy = true; refresh(); hideMsg(); promptEl.blur();
  statusEl.classList.add("on");
  const t0 = Date.now(); let label = "Starting";
  const tick = setInterval(() => { statusText.innerHTML = label + " &middot; " + Math.round((Date.now() - t0)/1000) + "s"; }, 500);
  const token = tokenEl.value.trim();
  const errors = [];
  try {
    let url = null;
    for (let i = 0; i < MODELS.length && !url; i++){
      try {
        url = await editWith(MODELS[i], inputBlob, prompt, token, (t) => { label = (i ? "Trying backup &middot; " : "") + t; });
      } catch (e){
        const t = errText(e); errors.push(t); console.warn(MODELS[i].space, t);
      }
    }
    if (!url) throw new Error(errors.join(" | "));
    label = "Almost done";
    let blob = null;
    try { const r = await fetch(url); if (r.ok) blob = await r.blob(); } catch(_){}
    showResult(url, blob);
  } catch (e){
    const all = errText(e);
    if (isQuota(all)){
      showMsg(token
        ? "You've used today's free AI time on this token. Try again tomorrow."
        : "Daily free limit reached. It resets in about a day, so try again tomorrow. (Advanced lets you add a free Hugging Face token for more.)", "limit");
    } else if (/sleep|paused|building|not running|could not resolve|failed to fetch|network/i.test(all)){
      showMsg("The free AI is waking up or busy right now. Give it a minute and try again.", "err");
    } else {
      showMsg("That edit didn't work. Try again or reword it. (" + all.slice(0, 160) + ")", "err");
    }
  } finally {
    clearInterval(tick); statusEl.classList.remove("on");
    busy = false; refresh();
  }
}
go.addEventListener("click", run);

function showResult(url, blob){
  outBlob = blob;
  if (outUrl) URL.revokeObjectURL(outUrl);
  outUrl = blob ? URL.createObjectURL(blob) : null;
  out.src = outUrl || url;
  beforeImg.src = inputUrl;
  result.classList.add("on");
  setTimeout(() => result.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
}

// Hold to compare
const showBefore = (on) => { stage.classList.toggle("show-before", on); pill.textContent = on ? "Before" : "After"; };
stage.addEventListener("pointerdown", (e) => { e.preventDefault(); showBefore(true); });
["pointerup","pointerleave","pointercancel"].forEach(t => stage.addEventListener(t, () => showBefore(false)));
stage.addEventListener("contextmenu", (e) => e.preventDefault());

$("save").addEventListener("click", async () => {
  let blob = outBlob;
  if (!blob){ try { blob = await (await fetch(out.src)).blob(); } catch(_){ window.open(out.src, "_blank"); return; } }
  const ext = (blob.type.split("/")[1] || "png").replace("jpeg","jpg").replace("webp","webp");
  const file = new File([blob], "edit-" + Date.now() + "." + ext, { type: blob.type || "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
    try { await navigator.share({ files: [file] }); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

$("again").addEventListener("click", async () => {
  if (!outBlob){ try { outBlob = await (await fetch(out.src)).blob(); } catch(_){ return; } }
  // re-encode to JPEG within size limit
  setInput(await downscale(outBlob));
  promptEl.value = ""; refresh();
  result.classList.remove("on");
  window.scrollTo({ top: 0, behavior: "smooth" });
  promptEl.focus();
});

refresh();
</script>
</body>
</html>
