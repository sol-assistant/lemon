<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Lemon: a free AI image generator that looks things up before it draws them.">
<title>Lemon &#x1F34B;</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='34' rx='24' ry='18' transform='rotate(-30 32 34)' fill='%23FFD60A' stroke='%23E0A800' stroke-width='3'/%3E%3Cpath d='M44 12c4-6 12-6 14-4-4 2-8 6-14 4z' fill='%2357B435'/%3E%3C/svg%3E">
<style>
:root{
  --yellow:#E6B800;   /* main yellow: title, middle text, send button */
  --gold:#B38C00;     /* darker yellow for small text so it stays readable */
  --deep:#7A6200;     /* darkest yellow for tiny text */
  --soft:#FFF8D6;     /* pale yellow fills */
  --line:#F2E3A0;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#FFFFFF}
body{
  overflow:hidden;
  font-family:"Helvetica Neue Light","HelveticaNeue-Light","Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;
  font-weight:300;color:var(--gold);
  -webkit-text-size-adjust:100%;
}
.lemon{width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;animation:swipeUp .8s ease-out}

/* ---------- top ---------- */
.header{flex-shrink:0;padding:calc(50px + env(safe-area-inset-top)) 60px 20px}
.title{margin:0;font-size:52px;line-height:1.1;font-weight:300;letter-spacing:.5px;color:var(--yellow)}
.title span{font-size:.8em;margin-left:6px;vertical-align:2px}

/* ---------- middle ---------- */
.conversation{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 60px 35px;-webkit-overflow-scrolling:touch}
.hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 30px 40px;text-align:center;font-size:30px;line-height:1.35;font-weight:300;color:var(--yellow);
  transition:opacity .3s ease,transform .3s ease;pointer-events:none;
}
.hint.gone{opacity:0;transform:translateY(-25px)}
#result{display:none;max-width:560px;animation:messageUp .35s ease-out}
.message{margin-bottom:22px;overflow-wrap:anywhere}
.sender{font-size:16px;color:var(--gold);opacity:.8;margin-bottom:5px}
.messageText{font-size:24px;line-height:1.4;color:var(--yellow)}

.frame{position:relative;width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--soft)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .5s}
.frame img.on{opacity:1}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;font-size:17px;color:var(--gold);font-weight:300}
.loading .spin{font-size:46px;line-height:1;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-8px) rotate(12deg)}}
.err{color:#9A4A00}

.actions{display:flex;gap:22px;margin-top:10px}
.actions button{padding:6px 0;font-size:16px;color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.actions button:disabled{opacity:.35;cursor:default}

details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details + details{margin-top:6px}
summary{cursor:pointer;font-size:15px;color:var(--gold);letter-spacing:.05em;text-transform:uppercase;list-style:none;padding:4px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:inline-block;width:18px;font-weight:300}
details[open] summary::before{content:"\2212"}
.look{display:flex;flex-direction:column;gap:10px;margin:10px 0 4px}
.kw{display:flex;gap:12px;align-items:flex-start}
.kw img,.kw .ph{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft)}
.kw .ph{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold)}
.kw b{font-weight:300;font-size:16px;font-weight:300;color:var(--gold)}
.kw p{margin:2px 0 3px;font-size:14px;line-height:1.35;color:var(--deep)}
.kw a{font-size:13px;color:var(--gold)}
.kw.miss{opacity:.6}
.note{font-size:14px;color:var(--deep);margin:6px 0 0}
#final{font-family:inherit;font-size:13px;line-height:1.45;word-break:break-word;margin:8px 0 2px;color:var(--deep)}

/* ---------- bottom ---------- */
.inputArea{flex-shrink:0;padding:14px 60px 30px;padding-bottom:max(22px,env(safe-area-inset-bottom));background:rgba(255,255,255,.97)}
.seg{display:flex;gap:18px;margin-bottom:6px}
.seg button{padding:4px 0;font-size:14px;color:var(--gold);opacity:.55}
.seg button[aria-pressed="true"]{opacity:1;text-decoration:underline;text-underline-offset:4px;font-weight:300}
.inputBox{max-width:900px;display:flex;align-items:center;border-bottom:1px solid #D9C980;transition:border-color .2s}
.inputBox:focus-within{border-bottom:2px solid var(--yellow);margin-bottom:-1px}
#prompt{flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:inherit;font-size:21px;font-weight:300;padding:12px 0;color:var(--gold);border-radius:0;-webkit-appearance:none}
#prompt::placeholder{color:#D4C27A}
button{border:none;background:transparent;font-family:inherit;font-size:18px;cursor:pointer;padding:10px 0 10px 18px;color:var(--yellow)}
#go{font-weight:300;color:var(--yellow)}
#go:disabled{opacity:.4;cursor:default}
button:hover{color:var(--gold)}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--yellow);outline-offset:4px}
.credit{margin:10px 0 0;font-size:12px;color:#B8A75A}
.credit a{color:inherit}

@keyframes swipeUp{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:translateY(0)}}
@keyframes messageUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

@media (max-width:600px){
  .header{padding:calc(30px + env(safe-area-inset-top)) 25px 10px}
  .title{font-size:44px}
  .conversation{padding:16px 25px 24px}
  .hint{font-size:26px}
  .inputArea{padding-left:25px;padding-right:25px}
  .messageText{font-size:21px}
  #prompt{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
b,strong,h1,h2,h3,button,input,summary{font-weight:300}</style>
</head>
<body>
<div class="lemon">

<header class="header">
  <h1 class="title">Lemon<span aria-hidden="true">&#x1F34B;</span></h1>
</header>

<main id="conversation" class="conversation" aria-label="Image">
  <div id="hint" class="hint">Type a prompt to generate an image</div>

  <section id="result" aria-live="polite">
    <div class="message">
      <div class="sender">You</div>
      <div class="messageText" id="you"></div>
    </div>
    <div class="message">
      <div class="sender">Lemon</div>
      <div class="frame" id="frame">
        <img id="out" alt="">
        <div class="loading" id="loading">
          <div class="spin" aria-hidden="true">&#x1F34B;</div>
          <div id="status">Squeezing...</div>
        </div>
      </div>
      <div class="actions">
        <button id="dl" type="button" disabled>Save</button>
        <button id="again" type="button" disabled>New seed</button>
      </div>
      <details id="ldetails">
        <summary>What Lemon looked up<span id="lookn"></span></summary>
        <div class="look" id="look"></div>
      </details>
      <details id="pdetails">
        <summary>Final prompt</summary>
        <p id="final"></p>
      </details>
    </div>
  </section>
</main>

<form id="inputForm" class="inputArea" autocomplete="off">
  <div class="seg" role="group" aria-label="Shape" id="aspect">
    <button type="button" data-a="square" aria-pressed="true">Square</button>
    <button type="button" data-a="portrait" aria-pressed="false">Portrait</button>
    <button type="button" data-a="landscape" aria-pressed="false">Landscape</button>
  </div>
  <div class="inputBox">
    <input id="prompt" type="text" placeholder="Ask Lemon..." maxlength="240" enterkeyhint="send" aria-label="Prompt">
    <button id="go" type="submit">Send</button>
  </div>
  <p class="credit">images via <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations</a></p>
</form>

</div>

<script>
(function(){
"use strict";

/* ---------- 1. keyword extraction ---------- */
var STOP = ("a an the and or but if of in on at to for from by with without into onto over under above below near " +
 "beside behind between through during while up down out off again then than so very too just also only really " +
 "is are was were be been being am do does did doing has have had having it its this that these those there here " +
 "i me my we our you your he she him her his they them their what which who whom whose where when why how " +
 "some any all each every no not more most many much few lots lot one two three four five six seven eight nine ten " +
 "make made making create draw drawing paint painting picture image photo photograph render style styled cartoon " +
 "realistic hyperrealistic detailed high quality 4k 8k hd art artwork illustration digital please show me give " +
 "like looking look looks big small tiny huge giant little cute cool nice pretty beautiful ugly funny happy sad angry " +
 "old new young bright dark light pale shiny tall short long fat thin round " +
 "red orange yellow green blue purple pink brown black white gray grey gold golden silver rainbow colorful neon pastel " +
 "wearing wears wear sitting sits sit standing stands stand holding holds hold flying flies fly running runs run " +
 "walking walks walk eating eats eat playing plays play riding rides ride jumping swimming sleeping dancing " +
 "inside outside top bottom front back middle left right side next across around along against toward towards " +
 "made using use while during day night morning evening scene background foreground view closeup close").split(" ");
var STOPSET = {}; STOP.forEach(function(w){ if(w) STOPSET[w]=1; });
var KEEP_ING = {building:1,ring:1,king:1,wing:1,string:1,swing:1,ceiling:1,spring:1,pudding:1,dumpling:1,viking:1,earring:1,clothing:1,lightning:1};

function extractKeywords(text){
  var words = text.toLowerCase().replace(/[^a-z0-9'\- ]+/g," ").split(/\s+/);
  var out = [];
  for (var i=0;i<words.length;i++){
    var w = words[i].replace(/^['\-]+|['\-]+$/g,"").replace(/'s$/,"");
    if (w.length < 3 || STOPSET[w] || /^\d+$/.test(w)) continue;
    if (/ing$/.test(w) && !KEEP_ING[w]) continue;
    if (/ly$/.test(w) && w !== "lily" && w !== "jelly" && w !== "belly" && w !== "fly") continue;
    if (out.indexOf(w) === -1) out.push(w);
    if (out.length >= 4) break;
  }
  return out;
}

/* ---------- 2. Wikipedia lookup ---------- */
var VISUAL = ("red orange yellow green blue purple pink brown black white gray grey golden gold silver dark bright pale " +
 "striped spotted colored coloured colors colours tinted darkened polarized transparent clear shiny glossy metallic " +
 "round flat long short tall small large tiny huge pointed triangular curved oval square rectangular serpentine " +
 "flattened bushy thick thin sharp smooth rough fluffy furry hairy slender stout upright upturned wide narrow " +
 "fur feathers feathered scales scaly tail tails ears ear eyes eye wings wing claws claw legs legged beak bill horns horn " +
 "snout muzzle teeth tusks mane paws hooves fins shell shells body skin rind peel leaves petals stem trunk branches " +
 "lenses lens frame roof walls wall tower towers spire dome windows door arms wheels " +
 "sand pebbles gravel rock rocks stone stones brick metal steel iron wood wooden glass plastic fabric leather " +
 "dough crust cheese tomato sauce cream ice waves fruit seeds").split(" ");
var VSET = {}; VISUAL.forEach(function(w){ if(w) VSET[w]=1; });
var BACKSTOP = {a:1,an:1,the:1,and:1,or:1,but:1,is:1,are:1,was:1,were:1,has:1,have:1,it:1,they:1,"this":1,that:1,which:1,"with":1,of:1,its:1,their:1,to:1,from:1,in:1,on:1,"for":1,by:1,as:1,such:1,possesses:1,features:1,featuring:1};
var MADE = /^(made|covered|topped|composed|consisting)$/i;

function bare(t){ return t.toLowerCase().replace(/[^a-z\-]/g,""); }
function isV(t){ var b = bare(t); if (VSET[b]) return true; var ps = b.split("-"); for (var i=0;i<ps.length;i++) if (VSET[ps[i]]) return true; return false; }
function stripParens(s){ var prev; do { prev = s; s = s.replace(/\s*\([^()]*\)/g,""); } while (s !== prev); return s; }
function words(s){ return s.split(/\s+/).filter(Boolean); }
function endsClause(t){ return /[,;:.!?]$/.test(t); }
function trimTo(s, n){
  var w = words(s);
  if (w.length > n) w = w.slice(0, n);
  while (w.length && /^(and|or|of|with|the|a|an|to|in|on|for|from|by|as|such|that|which|other|etc)$/i.test(bare(w[w.length-1]))) w.pop();
  return w.join(" ").replace(/[,;:.]+$/,"");
}

// best run of visual words inside one sentence, max ~12 words
function visualWindow(s, maxW){
  var t = words(s), best = null;
  for (var i=0;i<t.length;i++){
    if (!isV(t[i])) continue;
    var cnt = 0, last = i;
    for (var j=i;j<Math.min(t.length, i+maxW);j++){ if (isV(t[j])) { cnt++; last = j; } }
    if (!best || cnt > best.cnt) best = {start:i, end:last, cnt:cnt};
  }
  if (!best) return null;
  var a = best.start, b = best.end;
  // back up over modifiers ("slightly", "roughly") or "made of"
  for (var k=0;k<2 && a>0;k++){
    var p = t[a-1];
    if (endsClause(p)) break;
    if (BACKSTOP[bare(p)]){
      if ((bare(p)==="of"||bare(p)==="from"||bare(p)==="with"||bare(p)==="in") && a>1 && MADE.test(bare(t[a-2]))) { a -= 2; }
      break;
    }
    a--;
  }
  // finish the clause if it is only a few more words ("in form", "polarized or darkened")
  if (!endsClause(t[b])){
    for (var e=b+1;e<Math.min(t.length,b+4);e++){ if (endsClause(t[e])) { b = e; break; } }
  }
  var out = t.slice(a, b+1).join(" ");
  out = out.replace(/^(such as|including|like|and|or|with)\s+/i,"").replace(/^(a|an|the)\s+/i,"");
  out = out.replace(/;/g, ",").replace(/,\s*(and|or)\s+(an?|the)\s+/gi, ", ").replace(/,\s*(an?|the)\s+/gi, ", ");
  return { text: trimTo(out, 13), cnt: best.cnt };
}

function describe(title, extract){
  var text = stripParens(extract || "").replace(/\b(etc|e\.g|i\.e|approx|St|Mt|Dr)\./g, "$1").replace(/\s+/g," ").trim();
  if (!text) return "";
  var sents = text.match(/[^.!?]+[.!?]+(\s|$)/g) || [text];
  sents = sents.slice(0, 7).map(function(s){ return s.trim(); });

  // definition from first sentence: "X is a ____"
  var def = "", rest0 = "";
  var m = sents[0].match(/\b(?:is|are|was|were)\s+(?:an?\s+|the\s+)?(.*)$/i);
  if (m){
    var d = m[1].replace(/^(type|form|kind|species|member|genus|group|variety|piece|style) of\s+(an?\s+|the\s+)?/i,"");
    var cut = d.search(/[,;]|\s(which|that|who|belonging|found|built|used|designed|capable|trained|known|also|usually|typically|often|native|consisting|originally|primarily|mainly|with|in the|of the family|from the)\b/i);
    var dpart = cut > 0 ? d.slice(0, cut) : d;
    def = trimTo(dpart, 7);
    rest0 = d.slice(def.length);
  }

  var best = null;
  sents.forEach(function(s, i){
    var w = visualWindow(i === 0 ? rest0 : s, 12);
    if (w && (!best || w.cnt > best.cnt)) best = w;
  });

  if (def && best && /\bfruit\b/i.test(best.text) && /\b(tree|plant|shrub|species|genus)\b/i.test(def)) def = "";
  var out = [];
  if (def) out.push(def);
  if (best && best.text){
    if (def && words(def).length + words(best.text).length > 16) {
      out = [trimTo(def, Math.max(2, 16 - words(best.text).length))];
      if (!out[0]) out = [];
    }
    if (!def || best.text.toLowerCase().indexOf(def.toLowerCase()) === -1) out.push(best.text);
  }
  return out.join(", ").replace(/\s+,/g,",").replace(/,{2,}/g,",").replace(/\s{2,}/g," ").trim();
}

var API = "https://en.wikipedia.org/w/api.php";
function lookup(word){
  var url = API + "?action=query&format=json&origin=*&redirects=1&generator=search&gsrlimit=1&gsrnamespace=0" +
            "&gsrsearch=" + encodeURIComponent(word) +
            "&prop=extracts|pageimages|info&inprop=url&exintro=1&explaintext=1&exchars=1600&pithumbsize=160&piprop=thumbnail";
  function once(){
    return fetch(url).then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); });
  }
  return once().catch(function(){ return new Promise(function(res){ setTimeout(res, 700); }).then(once); })
    .then(function(j){
      if (!j || !j.query || !j.query.pages) return null;
      var pages = j.query.pages, p = pages[Object.keys(pages)[0]];
      if (!p || !p.extract || /may refer to|may also refer to/i.test(p.extract)) return null;
      var desc = describe(p.title, p.extract);
      if (!desc) return null;
      return {
        word: word, title: p.title, desc: desc,
        url: p.fullurl || ("https://en.wikipedia.org/wiki/" + encodeURIComponent(p.title.replace(/ /g,"_"))),
        thumb: p.thumbnail ? p.thumbnail.source : ""
      };
    })
    .catch(function(){ return null; });
}

/* ---------- 3. enriched prompt ---------- */
function buildPrompt(orig, found){
  var base = orig.trim().replace(/[.\s]+$/,"");
  var max = 400;
  var bits = found.map(function(f){ return f.word + ": " + f.desc; });
  var p = base + (bits.length ? ", " + bits.join("; ") : "");
  // shrink each description evenly until it fits
  var n = 15;
  while (p.length > max && n > 3){
    n--;
    bits = found.map(function(f){ return f.word + ": " + trimTo(f.desc.replace(/,/g," ,").replace(/\s+,/g,","), n); });
    p = base + (bits.length ? ", " + bits.join("; ") : "");
  }
  if (p.length > max) p = p.slice(0, max).replace(/[\s,;:]+\S*$/,"");
  return p;
}

/* ---------- 4. image ---------- */
var SIZES = { square:[768,768], portrait:[640,896], landscape:[896,640] };
function imageUrl(prompt, aspect, seed){
  var s = SIZES[aspect] || SIZES.square;
  return "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
    "?width=" + s[0] + "&height=" + s[1] + "&nologo=true&model=sana&seed=" + seed;
}

/* ---------- UI ---------- */
var $ = function(id){ return document.getElementById(id); };
var state = { aspect:"square", prompt:"", seed:0, url:"", busy:false, token:0 };
var LEMON = "\uD83C\uDF4B";

Array.prototype.forEach.call(document.querySelectorAll("#aspect button"), function(b){
  b.onclick = function(){
    state.aspect = b.getAttribute("data-a");
    Array.prototype.forEach.call(document.querySelectorAll("#aspect button"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    setFrameRatio();
    if (state.prompt && !state.busy) paint(true);
  };
});
function setFrameRatio(){
  var s = SIZES[state.aspect];
  $("frame").style.aspectRatio = s[0] + " / " + s[1];
}

function setStatus(t, isErr){
  $("loading").style.display = "flex";
  $("status").textContent = t;
  $("status").className = isErr ? "err" : "";
}

function renderLookups(words, found){
  var box = $("look"); box.innerHTML = "";
  $("lookn").textContent = words.length ? " (" + found.length + " of " + words.length + ")" : "";
  if (!words.length){
    box.innerHTML = '<p class="note">No key words to look up, so Lemon used your prompt as is.</p>'; return;
  }
  words.forEach(function(w){
    var f = null; found.forEach(function(x){ if (x.word === w) f = x; });
    var el = document.createElement("div");
    el.className = "kw" + (f ? "" : " miss");
    if (f){
      var img = f.thumb ? '<img src="' + f.thumb + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '<div class="ph">' + LEMON + '</div>';
      el.innerHTML = img + '<div><b></b><p></p><a target="_blank" rel="noopener"></a></div>';
      el.querySelector("b").textContent = w;
      el.querySelector("p").textContent = f.desc;
      var a = el.querySelector("a"); a.href = f.url; a.textContent = "Wikipedia: " + f.title + " \u2197";
    } else {
      el.innerHTML = '<div class="ph">?</div><div><b></b><p>Nothing useful found, skipped.</p></div>';
      el.querySelector("b").textContent = w;
    }
    box.appendChild(el);
  });
}

function go(){
  var text = $("prompt").value.trim();
  if (!text){ $("prompt").focus(); $("prompt").placeholder = "Type something first " + LEMON; return; }
  if (state.busy) return;
  state.busy = true; state.prompt = ""; state.blob = null; var token = ++state.token;
  $("go").disabled = true; $("dl").disabled = true; $("again").disabled = true;
  $("hint").classList.add("gone");
  $("you").textContent = text;
  $("result").style.display = "block";
  var out = $("out"); out.className = ""; out.removeAttribute("src");
  setFrameRatio();
  $("look").innerHTML = ""; $("final").textContent = "";

  var kws = extractKeywords(text);
  setStatus(kws.length ? "Looking up " + kws.join(", ") + "..." : "Squeezing...");
  $("conversation").scrollTop = 0;
  $("prompt").blur();

  Promise.all(kws.map(lookup)).then(function(res){
    if (token !== state.token) return;
    var found = res.filter(Boolean);
    renderLookups(kws, found);
    state.prompt = buildPrompt(text, found);
    $("final").textContent = state.prompt;
    paint(true);
  });
}

var COOLDOWN = 46000;  /* the free image service allows about 1 image every 45 seconds per device */
function lastReq(){ try { return +localStorage.getItem("lemonLast") || 0; } catch(e){ return state.last || 0; } }
function markReq(){ state.last = Date.now(); try { localStorage.setItem("lemonLast", String(state.last)); } catch(e){} }

function lockButtons(){ $("go").disabled = true; $("dl").disabled = true; $("again").disabled = true; }
function unlockButtons(withSave){ state.busy = false; $("go").disabled = false; $("again").disabled = false; $("dl").disabled = !withSave; }

function countdown(token, ms, label, then){
  var end = Date.now() + ms;
  (function step(){
    if (token !== state.token) return;
    var left = Math.ceil((end - Date.now()) / 1000);
    if (left <= 0) return then();
    setStatus(label + " " + left + "s");
    setTimeout(step, 250);
  })();
}

function paint(newSeed, tries){
  if (!state.prompt) return;
  tries = tries || 0;
  if (newSeed) state.seed = Math.floor(Math.random() * 1e9);
  var token = ++state.token;
  state.busy = true; lockButtons();
  var out = $("out"); out.className = "";
  var wait = COOLDOWN - (Date.now() - lastReq());
  if (wait > 0){
    countdown(token, wait, "Free images are 1 every 45 seconds. Starting in", function(){ request(token, tries); });
  } else request(token, tries);
}

function request(token, tries){
  var url = imageUrl(state.prompt, state.aspect, state.seed);
  state.url = url; state.blob = null;
  var out = $("out");
  markReq();
  var t0 = Date.now();
  setStatus("Drawing it...");
  var tick = setInterval(function(){
    if (token !== state.token) return clearInterval(tick);
    $("status").textContent = "Drawing it... " + Math.round((Date.now() - t0) / 1000) + "s";
  }, 1000);
  var ctrl = ("AbortController" in window) ? new AbortController() : null;
  var killer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 90000);
  function stop(){ clearInterval(tick); clearTimeout(killer); }

  fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function(r){
    if (r.ok) return r.blob().then(function(b){ return { blob: b }; });
    return r.text().then(function(t){
      var secs = parseInt(r.headers.get("Retry-After"), 10);
      var m = /retry after (\d+)/i.exec(t || ""); if (!secs && m) secs = parseInt(m[1], 10);
      return { status: r.status, secs: secs || 0 };
    });
  }).then(function(res){
    stop();
    if (token !== state.token) return;
    if (res.blob){
      if (!/^image\//.test(res.blob.type || "image/")) throw new Error("not an image");
      state.blob = res.blob; markReq();
      if (state.objUrl) URL.revokeObjectURL(state.objUrl);
      state.objUrl = URL.createObjectURL(res.blob);
      out.onload = function(){
        if (token !== state.token) return;
        if (!out.naturalWidth) return showFail("The image came back empty. Tap New seed to try again.");
        out.alt = state.prompt; out.className = "on";
        $("loading").style.display = "none";
        unlockButtons(true);
      };
      out.onerror = function(){ if (token === state.token) showFail("The image came back broken. Tap New seed to try again."); };
      out.src = state.objUrl;
      return;
    }
    if ((res.status === 402 || res.status === 429) && tries < 2){
      // busy / free limit: wait it out and try again on our own
      try { localStorage.setItem("lemonLast", String(Date.now() - COOLDOWN + (res.secs ? res.secs * 1000 + 1500 : COOLDOWN))); } catch(e){}
      state.last = Date.now() - COOLDOWN + (res.secs ? res.secs * 1000 + 1500 : COOLDOWN);
      return paint(false, tries + 1);
    }
    showFail("The image service said no (" + res.status + "). Tap New seed to try again.");
  }).catch(function(err){
    stop();
    if (token !== state.token) return;
    if (tries < 1 && !(err && err.name === "AbortError")){
      state.last = Date.now(); try { localStorage.setItem("lemonLast", String(state.last)); } catch(e){}
      return paint(false, tries + 1);
    }
    showFail(err && err.name === "AbortError" ? "That took too long. Tap New seed to try again." : "Couldn't reach the image service. Tap New seed to try again.");
  });

  function showFail(msg){
    out.removeAttribute("src"); out.className = "";
    setStatus(msg, true);
    unlockButtons(false);
  }
}

$("inputForm").addEventListener("submit", function(e){ e.preventDefault(); go(); });
$("again").onclick = function(){ if (!state.busy) paint(true); };

$("dl").onclick = function(){
  if (!state.blob){ if (state.url) window.open(state.url, "_blank", "noopener"); return; }
  var name = "lemon-" + state.seed + ".jpg";
  var file = null;
  try { file = new File([state.blob], name, { type: state.blob.type || "image/jpeg" }); } catch(e){}
  // iPhone: the share sheet has "Save Image"
  if (file && navigator.canShare && navigator.canShare({ files: [file] })){
    navigator.share({ files: [file] }).catch(function(){});
    return;
  }
  var a = document.createElement("a"); a.href = state.objUrl; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
};

// expose for testing
window.Lemon = { extractKeywords: extractKeywords, describe: describe, buildPrompt: buildPrompt };
})();
</script>
